<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Recorrente</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4" style="max-width: 800px;">
        <h2 class="mb-4 text-center">Controle Financeiro</h2>

        <!-- NAVEGAÇÃO DE MESES -->
        <div class="card shadow-sm mb-4 bg-white">
            <div class="card-body py-2 d-flex justify-content-between align-items-center">
                <button class="btn btn-outline-secondary btn-sm" onclick="mudarMes(-1)">
                    <i class="bi bi-chevron-left"></i> Mês Anterior
                </button>
                <h5 id="label-mes-ano" class="mb-0 fw-bold text-dark">Outubro de 2026</h5>
                <button class="btn btn-outline-secondary btn-sm" onclick="mudarMes(1)">
                    Próximo Mês <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- CARD LÍQUIDO COM PENDÊNCIA (TOPO, DISCRETO) -->
        <div class="card border-secondary mb-4 shadow-sm bg-white">
            <div class="card-body py-3 text-center">
                <span class="text-muted small text-uppercase fw-bold tracking-wide">Líquido (Considerando Pendências do Mês)</span>
                <h3 id="card-liquido" class="text-dark mb-0 fw-bold">R$ 0,00</h3>
            </div>
        </div>

        <!-- CARDS 2x2 -->
        <div class="row g-3 mb-4">
            <!-- Linha 1 -->
            <div class="col-6">
                <div class="card text-white bg-success shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Receitas</h6>
                        <h4 id="card-receitas" class="mb-0">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-white bg-primary shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Saldo (Caixa Real)</h6>
                        <h4 id="card-saldo" class="mb-0">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <!-- Linha 2 -->
            <div class="col-6">
                <div class="card text-white bg-danger shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Despesas Pagas</h6>
                        <h4 id="card-despesas-pagas" class="mb-0">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-white bg-warning shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Despesas Pendentes</h6>
                        <h4 id="card-despesas-pendentes" class="mb-0">R$ 0,00</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Adicionar Lançamento</h5>
            </div>
            <div class="card-body">
                <form id="form-transacao">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tipo</label>
                            <select id="tipo" class="form-select" onchange="toggleStatus()">
                                <option value="receita">Receita</option>
                                <option value="despesa" selected>Despesa</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Descrição</label>
                            <input type="text" id="descricao" class="form-control" required placeholder="Ex: Aluguel">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Valor (R$)</label>
                            <input type="number" step="0.01" id="valor" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="col-md-3 d-flex align-items-end" id="box-status">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="status-checkbox">
                                <label class="form-check-label" id="label-status-checkbox" for="status-checkbox">Pago?</label>
                            </div>
                        </div>
                        <div class="col-12" id="box-recorrente">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="recorrente">
                                <label class="form-check-label text-secondary" for="recorrente">
                                    <small><i class="bi bi-arrow-repeat"></i> Conta recorrente (duplicar automaticamente como pendente para o próximo mês)</small>
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- LISTA DE LANÇAMENTOS -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Histórico do Mês</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-transacoes">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let transacoes = [];
        // Data atual simulada no formato "AAAA-MM"
        let dataAtual = new Date();
        let anoAtual = dataAtual.getFullYear();
        let mesAtual = dataAtual.getMonth(); // 0 a 11

        const nomesMeses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        function mudarMes(direcao) {
            mesAtual += direcao;
            if (mesAtual > 11) {
                mesAtual = 0;
                anoAtual++;
            } else if (mesAtual < 0) {
                mesAtual = 11;
                anoAtual--;
            }
            atualizarInterface();
        }

        function toggleStatus() {
            const tipo = document.getElementById('tipo').value;
            const checkbox = document.getElementById('status-checkbox');
            const label = document.getElementById('label-status-checkbox');
            const boxRecorrente = document.getElementById('box-recorrente');

            if (tipo === 'receita') {
                label.innerText = "Recebido?";
                checkbox.checked = true;
                boxRecorrente.style.display = 'none'; // Recorrência focada em despesas, mas pode ajustar se quiser
            } else {
                label.innerText = "Pago?";
                checkbox.checked = false;
                boxRecorrente.style.display = 'block';
            }
        }

        function formatarMesAno(ano, mes) {
            return `${nomesMeses[mes]} de ${ano}`;
        }

        function obterChaveMes(ano, mes) {
            return `${ano}-${String(mes + 1).padStart(2, '0')}`;
        }

        document.getElementById('form-transacao').addEventListener('submit', function(e) {
            e.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const statusCheckbox = document.getElementById('status-checkbox').checked;
            const recorrente = tipo === 'despesa' ? document.getElementById('recorrente').checked : false;

            const mesAnoChave = obterChaveMes(anoAtual, mesAtual);

            // 1. Cadastra no mês atual
            const transacao = {
                id: Date.now(),
                mesAno: mesAnoChave,
                tipo,
                descricao,
                valor,
                efetivado: statusCheckbox
            };
            transacoes.push(transacao);

            // 2. Se for recorrente, cria automaticamente uma cópia como PENDENTE para o PRÓXIMO mês
            if (recorrente) {
                let proximoMes = mesAtual + 1;
                let proximoAno = anoAtual;
                if (proximoMes > 11) {
                    proximoMes = 0;
                    proximoAno++;
                }
                const proximoMesAnoChave = obterChaveMes(proximoAno, proximoMes);

                const transacaoProximoMes = {
                    id: Date.now() + 1,
                    mesAno: proximoMesAnoChave,
                    tipo,
                    descricao,
                    valor,
                    efetivado: false // Próximo mês nasce pendente
                };
                transacoes.push(transacaoProximoMes);
            }

            atualizarInterface();
            this.reset();
            toggleStatus();
        });

        function deletar(id) {
            transacoes = transacoes.filter(t => t.id !== id);
            atualizarInterface();
        }

        function atualizarInterface() {
            // Atualizar o label do mês no topo
            document.getElementById('label-mes-ano').innerText = formatarMesAno(anoAtual, mesAtual);

            const mesAnoChaveAtual = obterChaveMes(anoAtual, mesAtual);

            let totalReceitas = 0;
            let totalDespesasPagas = 0;
            let totalDespesasPendentes = 0;

            const tbody = document.getElementById('tabela-transacoes');
            tbody.innerHTML = '';

            // Filtrar transações apenas do mês selecionado
            const transacoesDoMes = transacoes.filter(t => t.mesAno === mesAnoChaveAtual);

            transacoesDoMes.forEach(t => {
                if (t.tipo === 'receita') {
                    if (t.efetivado) {
                        totalReceitas += t.valor;
                    }
                } else {
                    if (t.efetivado) {
                        totalDespesasPagas += t.valor;
                    } else {
                        totalDespesasPendentes += t.valor;
                    }
                }

                // Montar badge da tabela
                let badgeStatus = '';
                if (t.tipo === 'receita') {
                    badgeStatus = t.efetivado 
                        ? '<span class="badge bg-success">Recebido</span>' 
                        : '<span class="badge bg-warning text-dark">A Receber</span>';
                } else {
                    badgeStatus = t.efetivado 
                        ? '<span class="badge bg-danger">Pago</span>' 
                        : '<span class="badge bg-warning text-dark">Pendente</span>';
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${t.tipo === 'receita' ? 'Receita' : 'Despesa'}</td>
                        <td>${t.descricao}</td>
                        <td>R$ ${t.valor.toFixed(2)}</td>
                        <td>${badgeStatus}</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="deletar(${t.id})">Excluir</button></td>
                    </tr>
                `;
            });

            // Se não houver transações no mês
            if (transacoesDoMes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">Nenhum lançamento neste mês.</td></tr>`;
            }

            // Cálculos
            const saldo = totalReceitas - totalDespesasPagas;
            const liquido = totalReceitas - (totalDespesasPagas + totalDespesasPendentes);

            // Atualizar Cards
            document.getElementById('card-receitas').innerText = `R$ ${totalReceitas.toFixed(2)}`;
            document.getElementById('card-despesas-pagas').innerText = `R$ ${totalDespesasPagas.toFixed(2)}`;
            document.getElementById('card-despesas-pendentes').innerText = `R$ ${totalDespesasPendentes.toFixed(2)}`;
            document.getElementById('card-saldo').innerText = `R$ ${saldo.toFixed(2)}`;
            document.getElementById('card-liquido').innerText = `R$ ${liquido.toFixed(2)}`;
        }

        // Inicializar
        atualizarInterface();
    </script>
</body>
</html>
