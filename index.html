<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Veículos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Responsivo Mobile-First -->
    <header class="bg-primary text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-car-side text-xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Meu Veículo</h1>
            </div>
            <button onclick="openVehicleModal()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Novo Veículo</span>
            </button>
        </div>
    </header>

    <!-- Main Container Otimizado para Mobile -->
    <main class="max-w-md mx-auto px-4 py-4 w-full flex-grow pb-24">

        <!-- Seletor de Veículos / Estado Vazio -->
        <section id="vehicle-section" class="mb-6">
            <!-- Renderizado dinamicamente via JS -->
        </section>

        <!-- Cards de Resumo / Topo do Card (Mês a Mês / Filtros) -->
        <div id="dashboard-content" class="hidden space-y-4">
            
            <!-- Seletor de Período / Mês a Mês -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Filtrar Período</span>
                    <span id="current-filter-label" class="text-xs font-semibold text-primary">Últimos 30 dias</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setFilter('30')" id="btn-30" class="py-2 text-xs font-medium rounded-lg bg-primary text-white transition">30 Dias</button>
                    <button onclick="setFilter('90')" id="btn-90" class="py-2 text-xs font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">90 Dias</button>
                    <button onclick="setFilter('all')" id="btn-all" class="py-2 text-xs font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Histórico</button>
                </div>
            </div>

            <!-- Resumo Financeiro e Desempenho -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-500 font-medium">Total Gasto</p>
                    <p id="stat-total" class="text-lg font-bold text-slate-800 mt-1">R$ 0,00</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-500 font-medium">Média Consumo</p>
                    <p id="stat-consumption" class="text-lg font-bold text-slate-800 mt-1">0.0 km/l</p>
                </div>
            </div>

            <!-- Ações Rápidas (Abastecimento / Manutenção) -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="openRecordModal('fuel')" class="bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl shadow-sm font-medium text-sm flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-gas-pump"></i>
                    <span>Abastecer</span>
                </button>
                <button onclick="openRecordModal('maintenance')" class="bg-amber-600 hover:bg-amber-700 text-white p-3 rounded-xl shadow-sm font-medium text-sm flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-wrench"></i>
                    <span>Manutenção</span>
                </button>
            </div>

            <!-- Lista de Lançamentos com Suporte a PDF -->
            <div class="mt-6">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Histórico de Registros</h3>
                    <span id="record-count" class="text-xs text-slate-400">0 itens</span>
                </div>
                <div id="records-list" class="space-y-3">
                    <!-- Registros dinâmicos -->
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Novo Veículo -->
    <div id="vehicle-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-800">Cadastrar Novo Veículo</h3>
                <button onclick="closeVehicleModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="vehicle-form" onsubmit="saveVehicle(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Apelido / Nome do Veículo</label>
                    <input type="text" id="v-name" required placeholder="Ex: Meu Carro / Moto" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Modelo / Placa</label>
                    <input type="text" id="v-model" required placeholder="Ex: Honda CG / ABC-1234" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Quilometragem Inicial (Fixa)</label>
                    <input type="number" id="v-km" required placeholder="Ex: 15000" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg text-sm font-medium transition mt-2">Salvar Veículo</button>
            </form>
        </div>
    </div>

    <!-- Modal Novo Registro (Abastecimento / Manutenção) -->
    <div id="record-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="record-modal-title" class="text-base font-bold text-slate-800">Novo Registro</h3>
                <button onclick="closeRecordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="record-form" onsubmit="saveRecord(event)" class="space-y-3">
                <input type="hidden" id="r-type">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Data</label>
                    <input type="date" id="r-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Quilometragem Atual</label>
                    <input type="number" id="r-km" required placeholder="Ex: 15200" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Valor Total (R$)</label>
                    <input type="number" step="0.01" id="r-cost" required placeholder="Ex: 50.00" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div id="fuel-extras" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Litros</label>
                        <input type="number" step="0.01" id="r-liters" placeholder="Ex: 10.5" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Anexar PDF / Comprovante (Opcional)</label>
                    <input type="file" id="r-pdf" accept=".pdf" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-primary/10 file:text-primary hover:file:bg-primary/20">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white py-2.5 rounded-lg text-sm font-medium transition mt-2">Salvar Registro</button>
            </form>
        </div>
    </div>

    <!-- Script de Gerenciamento do Estado Local -->
    <script>
        let db = JSON.parse(localStorage.getItem('vehicle_app_db')) || { vehicles: [], records: [] };
        let currentVehicleId = localStorage.getItem('vehicle_app_active_v') || null;
        let currentFilter = '30';

        function saveData() {
            localStorage.setItem('vehicle_app_db', JSON.stringify(db));
            if (currentVehicleId) localStorage.setItem('vehicle_app_active_v', currentVehicleId);
            render();
        }

        function render() {
            const vSection = document.getElementById('vehicle-section');
            const dashboard = document.getElementById('dashboard-content');

            if (db.vehicles.length === 0) {
                // Estado Vazio Correto: Nenhum veículo cadastrado
                dashboard.classList.add('hidden');
                vSection.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
                        <div class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                            <i class="fa-solid fa-car"></i>
                        </div>
                        <h2 class="text-base font-bold text-slate-800 mb-1">Nenhum veículo cadastrado</h2>
                        <p class="text-xs text-slate-500 mb-4">Cadastre seu primeiro veículo para começar a controlar abastecimentos e manutenções.</p>
                        <button onclick="openVehicleModal()" class="bg-primary text-white px-4 py-2 rounded-xl text-xs font-medium shadow hover:bg-primary/90 transition">
                            Cadastrar Agora
                        </button>
                    </div>
                `;
                return;
            }

            dashboard.classList.remove('hidden');
            if (!currentVehicleId || !db.vehicles.find(v => v.id === currentVehicleId)) {
                currentVehicleId = db.vehicles[0].id;
            }

            const activeVehicle = db.vehicles.find(v => v.id === currentVehicleId);
            
            // Renderiza seletor de veículos
            vSection.innerHTML = `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 bg-primary/10 text-primary rounded-lg flex items-center justify-center">
                            <i class="fa-solid fa-car text-sm"></i>
                        </div>
                        <div>
                            <h2 class="text-sm font-bold text-slate-800">${activeVehicle.name}</h2>
                            <p class="text-xs text-slate-500">${activeVehicle.model} • KM Base: ${activeVehicle.km}</p>
                        </div>
                    </div>
                    <select onchange="switchVehicle(this.value)" class="text-xs border border-slate-200 rounded-lg p-1.5 bg-slate-50 font-medium focus:outline-none">
                        ${db.vehicles.map(v => `<option value="${v.id}" ${v.id === currentVehicleId ? 'selected' : ''}>${v.name}</option>`).join('')}
                    </select>
                </div>
            `;

            renderDashboardMetrics();
        }

        function switchVehicle(id) {
            currentVehicleId = id;
            localStorage.setItem('vehicle_app_active_v', id);
            render();
        }

        function openVehicleModal() {
            document.getElementById('vehicle-modal').classList.remove('hidden');
        }
        function closeVehicleModal() {
            document.getElementById('vehicle-modal').classList.add('hidden');
        }

        function saveVehicle(e) {
            e.preventDefault();
            const newV = {
                id: 'v_' + Date.now(),
                name: document.getElementById('v-name').value,
                model: document.getElementById('v-model').value,
                km: Number(document.getElementById('v-km').value)
            };
            db.vehicles.push(newV);
            currentVehicleId = newV.id;
            closeVehicleModal();
            document.getElementById('vehicle-form').reset();
            saveData();
        }

        function openRecordModal(type) {
            document.getElementById('r-type').value = type;
            document.getElementById('record-modal-title').innerText = type === 'fuel' ? 'Novo Abastecimento' : 'Nova Manutenção';
            document.getElementById('fuel-extras').style.display = type === 'fuel' ? 'block' : 'none';
            document.getElementById('record-modal').classList.remove('hidden');
            document.getElementById('r-date').valueAsDate = new Date();
        }
        function closeRecordModal() {
            document.getElementById('record-modal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const type = document.getElementById('r-type').value;
            const pdfInput = document.getElementById('r-pdf');
            let pdfData = null;

            if (pdfInput.files && pdfInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    finishRecordSave(type, uploadEvent.target.result, pdfInput.files[0].name);
                };
                reader.readAsDataURL(pdfInput.files[0]);
            } else {
                finishRecordSave(type, null, null);
            }
        }

        function finishRecordSave(type, pdfBase64, pdfName) {
            const newRec = {
                id: 'r_' + Date.now(),
                vehicleId: currentVehicleId,
                type: type,
                date: document.getElementById('r-date').value,
                km: Number(document.getElementById('r-km').value),
                cost: Number(document.getElementById('r-cost').value),
                liters: type === 'fuel' ? Number(document.getElementById('r-liters').value) || 0 : 0,
                pdfData: pdfBase64,
                pdfName: pdfName
            };

            db.records.push(newRec);
            closeRecordModal();
            document.getElementById('record-form').reset();
            saveData();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['30', '90', 'all'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filter) {
                    btn.className = 'py-2 text-xs font-medium rounded-lg bg-primary text-white transition';
                } else {
                    btn.className = 'py-2 text-xs font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
                }
            });
            const labels = { '30': 'Últimos 30 dias', '90': 'Últimos 90 dias', 'all': 'Todo o Histórico' };
            document.getElementById('current-filter-label').innerText = labels[filter];
            renderDashboardMetrics();
        }

        function renderDashboardMetrics() {
            const now = new Date();
            let filtered = db.records.filter(r => r.vehicleId === currentVehicleId);

            if (currentFilter !== 'all') {
                const days = Number(currentFilter);
                const limitDate = new Date();
                limitDate.setDate(now.getDate() - days);
                filtered = filtered.filter(r => new Date(r.date) >= limitDate);
            }

            // Ordenar por data decrescente
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalCost = filtered.reduce((acc, r) => acc + r.cost, 0);
            const totalLiters = filtered.filter(r => r.type === 'fuel').reduce((acc, r) => acc + r.liters, 0);
            
            let kmPerLiter = 0;
            if (filtered.length >= 2) {
                const fuelRecs = filtered.filter(r => r.type === 'fuel').sort((a,b) => a.km - b.km);
                if (fuelRecs.length >= 2 && totalLiters > 0) {
                    const kmDriven = fuelRecs[fuelRecs.length - 1].km - fuelRecs[0].km;
                    kmPerLiter = kmDriven / totalLiters;
                }
            }

            document.getElementById('stat-total').innerText = `R$ ${totalCost.toFixed(2)}`;
            document.getElementById('stat-consumption').innerText = kmPerLiter > 0 ? `${kmPerLiter.toFixed(1)} km/l` : '-- km/l';
            document.getElementById('record-count').innerText = `${filtered.length} itens`;

            const listEl = document.getElementById('records-list');
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Nenhum registro encontrado neste período.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => `
                <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-lg flex items-center justify-center ${r.type === 'fuel' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                            <i class="fa-solid ${r.type === 'fuel' ? 'fa-gas-pump' : 'fa-wrench'} text-xs"></i>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-bold text-slate-800">${r.type === 'fuel' ? 'Abastecimento' : 'Manutenção'}</span>
                                <span class="text-[10px] text-slate-400">${new Date(r.date + 'T00:00:00').toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-0.5">KM: ${r.km} ${r.liters ? `• ${r.liters}L` : ''}</p>
                            ${r.pdfData ? `<a href="${r.pdfData}" download="${r.pdfName || 'comprovante.pdf'}" class="inline-flex items-center space-x-1 text-[10px] text-primary font-medium mt-1 hover:underline"><i class="fa-solid fa-file-pdf"></i><span>Ver PDF (${r.pdfName || 'Comprovante'})</span></a>` : ''}
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-slate-800">R$ ${r.cost.toFixed(2)}</span>
                        <br>
                        <button onclick="deleteRecord('${r.id}')" class="text-[10px] text-red-500 hover:text-red-700 mt-1"><i class="fa-solid fa-trash"></i> Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteRecord(id) {
            if (confirm('Deseja realmente excluir este registro?')) {
                db.records = db.records.filter(r => r.id !== id);
                saveData();
            }
        }

        // Inicialização
        render();
    </script>
</body>
</html>
