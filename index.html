<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu Embutido Financeiro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }
        
        /* Container do Menu Embutido */
        .menu-embutido {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        /* Botão que aciona a abertura */
        .menu-header {
            background-color: #ffffff;
            color: #333;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        /* Ícone da setinha */
        .menu-header::after {
            content: '▼';
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        /* Corpo do menu que fica oculto */
        .menu-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: #fafbfc;
            padding: 0 20px;
        }

        .menu-content ul {
            list-style: none;
            padding: 10px 0;
            margin: 0;
        }

        .menu-content li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            color: #555;
            cursor: pointer;
        }

        .menu-content li:last-child {
            border-bottom: none;
        }

        .menu-content li:hover {
            color: #007bff;
        }

        /* Classe ativa para abrir o menu */
        .menu-embutido.ativo .menu-content {
            max-height: 200px; /* Altura suficiente para mostrar os itens */
            padding: 10px 20px;
        }

        .menu-embutido.ativo .menu-header::after {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- Estrutura do Menu Embutido -->
    <div class="menu-embutido" id="meuMenu">
        <div class="menu-header" onclick="toggleMenu()">
            Opções Avançadas de Lançamento
        </div>
        <div class="menu-content">
            <ul>
                <li>📊 Gerar Relatório em PDF</li>
                <li>🔄 Configurar Parcelamento</li>
                <li>🏷️ Gerenciar Categorias</li>
            </ul>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('meuMenu');
            menu.classList.toggle('ativo');
        }
    </script>

</body>
</html>
