<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Simples</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h2 class="mb-4 text-center">Controle Financeiro</h2>

        <!-- CARDS -->
        <div class="row g-3 mb-4">
            <div class="col-md">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Receitas</h6>
                        <h4 id="card-receitas">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md">
                <div class="card text-white bg-danger shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Despesas Pagas</h6>
                        <h4 id="card-despesas-pagas">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md">
                <div class="card text-white bg-warning shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Desp. Pendentes</h6>
                        <h4 id="card-despesas-pendentes">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Saldo</h6>
                        <h4 id="card-saldo">R$ 0,00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md">
                <div class="card text-white bg-info shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">Líquido (c/ Pend.)</h6>
                        <h4 id="card-liquido">R$ 0,00</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Adicionar Lançamento</h5>
            </div>
            <div class="card-body">
                <form id="form-transacao">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Tipo</label>
                            <select id="tipo" class="form-select" onchange="toggleStatus()">
                                <option value="receita">Receita</option>
                                <option value="despesa" selected>Despesa</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Descrição</label>
                            <input type="text" id="descricao" class="form-control" required placeholder="Ex: Supermercado">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Valor (R$)</label>
                            <input type="number" step="0.01" id="valor" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="col-md-3 d-flex align-items-end" id="box-status">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="pago">
                                <label class="form-check-label" for="pago">Pago?</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- LISTA DE LANÇAMENTOS -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Histórico</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-transacoes">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        let transacoes = [];

        function toggleStatus() {
            const tipo = document.getElementById('tipo').value;
            const boxStatus = document.getElementById('box-status');
            if (tipo === 'receita') {
                boxStatus.style.display = 'none';
                document.getElementById('pago').checked = true; // Receita já entra como paga
            } else {
                boxStatus.style.display = 'flex';
                document.getElementById('pago').checked = false;
            }
        }

        document.getElementById('form-transacao').addEventListener('submit', function(e) {
            e.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const pago = tipo === 'receita' ? true : document.getElementById('pago').checked;

            const transacao = {
                id: Date.now(),
                tipo,
                descricao,
                valor,
                pago
            };

            transacoes.push(transacao);
            atualizarInterface();
            this.reset();
            toggleStatus();
        });

        function deletar(id) {
            transacoes = transacoes.filter(t => t.id !== id);
            atualizarInterface();
        }

        function atualizarInterface() {
            let totalReceitas = 0;
            let totalDespesasPagas = 0;
            let totalDespesasPendentes = 0;

            const tbody = document.getElementById('tabela-transacoes');
            tbody.innerHTML = '';

            transacoes.forEach(t => {
                if (t.tipo === 'receita') {
                    totalReceitas += t.valor;
                } else {
                    if (t.pago) {
                        totalDespesasPagas += t.valor;
                    } else {
                        totalDespesasPendentes += t.valor;
                    }
                }

                // Montar linha da tabela
                let badgeStatus = '';
                if (t.tipo === 'receita') {
                    badgeStatus = '<span class="badge bg-success">Recebido</span>';
                } else {
                    badgeStatus = t.pago 
                        ? '<span class="badge bg-danger">Pago</span>' 
                        : '<span class="badge bg-warning text-dark">Pendente</span>';
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${t.tipo === 'receita' ? 'Receita' : 'Despesa'}</td>
                        <td>${t.descricao}</td>
                        <td>R$ ${t.valor.toFixed(2)}</td>
                        <td>${badgeStatus}</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="deletar(${t.id})">Excluir</button></td>
                    </tr>
                `;
            });

            // Saldo = Receitas - Despesas Pagas
            const saldo = totalReceitas - totalDespesasPagas;
            // Líquido = Receitas - (Despesas Pagas + Despesas Pendentes)
            const liquido = totalReceitas - (totalDespesasPagas + totalDespesasPendentes);

            // Atualizar Cards
            document.getElementById('card-receitas').innerText = `R$ ${totalReceitas.toFixed(2)}`;
            document.getElementById('card-despesas-pagas').innerText = `R$ ${totalDespesasPagas.toFixed(2)}`;
            document.getElementById('card-despesas-pendentes').innerText = `R$ ${totalDespesasPendentes.toFixed(2)}`;
            document.getElementById('card-saldo').innerText = `R$ ${saldo.toFixed(2)}`;
            document.getElementById('card-liquido').innerText = `R$ ${liquido.toFixed(2)}`;
        }
    </script>
</body>
</html>
