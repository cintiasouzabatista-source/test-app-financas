<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Mobile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <div class="container py-3" style="max-width: 600px;">
        <h4 class="mb-3 text-center fw-bold text-primary">Controle Financeiro</h4>

        <!-- NAVEGAÇÃO DE MESES (Compacta Mobile) -->
        <div class="card shadow-sm mb-3 bg-white border-0">
            <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">
                <button class="btn btn-outline-secondary btn-sm rounded-circle p-1 px-2" onclick="mudarMes(-1)">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <h6 id="label-mes-ano" class="mb-0 fw-bold text-dark">Outubro de 2026</h6>
                <button class="btn btn-outline-secondary btn-sm rounded-circle p-1 px-2" onclick="mudarMes(1)">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- CARD LÍQUIDO COM PENDÊNCIA (TOPO, DISCRETO) -->
        <div class="card border-0 mb-3 shadow-sm bg-white text-center">
            <div class="card-body py-2">
                <span class="text-muted small text-uppercase fw-bold" style="font-size: 0.75rem;">Líquido (Considerando Pendências)</span>
                <h4 id="card-liquido" class="text-dark mb-0 fw-bold">R$ 0,00</h4>
            </div>
        </div>

        <!-- CARDS 2x2 -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="card text-white bg-success shadow-sm border-0 h-100">
                    <div class="card-body p-2">
                        <small class="opacity-75">Receitas</small>
                        <h5 id="card-receitas" class="mb-0 fw-bold">R$ 0,00</h5>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-white bg-primary shadow-sm border-0 h-100">
                    <div class="card-body p-2">
                        <small class="opacity-75">Saldo (Caixa)</small>
                        <h5 id="card-saldo" class="mb-0 fw-bold">R$ 0,00</h5>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-white bg-danger shadow-sm border-0 h-100">
                    <div class="card-body p-2">
                        <small class="opacity-75">Despesas Pagas</small>
                        <h5 id="card-despesas-pagas" class="mb-0 fw-bold">R$ 0,00</h5>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-white bg-warning shadow-sm border-0 h-100">
                    <div class="card-body p-2 text-dark">
                        <small class="opacity-75">Pendentes</small>
                        <h5 id="card-despesas-pendentes" class="mb-0 fw-bold">R$ 0,00</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-white py-2">
                <span class="fw-bold small text-secondary">Novo Lançamento</span>
            </div>
            <div class="card-body p-3">
                <form id="form-transacao">
                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label small mb-1">Tipo</label>
                            <select id="tipo" class="form-select form-select-sm" onchange="toggleStatus()">
                                <option value="receita">Receita</option>
                                <option value="despesa" selected>Despesa</option>
                            </select>
                        </div>
                        <div class="col-8">
                            <label class="form-label small mb-1">Descrição</label>
                            <input type="text" id="descricao" class="form-control form-control-sm" required placeholder="Ex: Aluguel">
                        </div>
                        <div class="col-6">
                            <label class="form-label small mb-1">Valor (R$)</label>
                            <input type="number" step="0.01" id="valor" class="form-control form-control-sm" required placeholder="0.00">
                        </div>
                        <div class="col-6 d-flex align-items-end" id="box-status">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="status-checkbox">
                                <label class="form-check-label small" id="label-status-checkbox" for="status-checkbox">Pago?</label>
                            </div>
                        </div>
                        <div class="col-12" id="box-recorrente">
                            <div class="form-check mt-1">
                                <input class="form-check-input" type="checkbox" id="recorrente">
                                <label class="form-check-label text-secondary small" for="recorrente">
                                    <i class="bi bi-arrow-repeat"></i> Conta recorrente (próx. mês como pendente)
                                </label>
                            </div>
                        </div>
                        <div class="col-12 mt-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100">Cadastrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- MENU SUSPENSO: GRÁFICOS (ENTRADA X SAÍDA) -->
        <div class="card shadow-sm border-0 mb-2">
            <div class="card-header bg-white py-2" data-bs-toggle="collapse" href="#collapseGraficos" role="button" aria-expanded="false" style="cursor: pointer;">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold small text-secondary"><i class="bi bi-bar-chart-fill"></i> Gráficos (Entrada x Saída)</span>
                    <i class="bi bi-chevron-down small"></i>
                </div>
            </div>
            <div class="collapse" id="collapseGraficos">
                <div class="card-body p-3">
                    <canvas id="graficoFinanceiro" style="max-height: 200px;"></canvas>
                </div>
            </div>
        </div>

        <!-- MENU SUSPENSO: HISTÓRICO -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-2" data-bs-toggle="collapse" href="#collapseHistorico" role="button" aria-expanded="false" style="cursor: pointer;">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold small text-secondary"><i class="bi bi-list-task"></i> Histórico de Lançamentos</span>
                    <i class="bi bi-chevron-down small"></i>
                </div>
            </div>
            <div class="collapse" id="collapseHistorico">
                <div class="card-body p-2">
                    <div class="table-responsive">
                        <table class="table table-sm table-striped align-middle mb-0" style="font-size: 0.85rem;">
                            <thead>
                                <tr>
                                    <th>Tipo</th>
                                    <th>Descrição</th>
                                    <th>Valor</th>
                                    <th>Status</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-transacoes">
                                <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle (com Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Principal -->
    <script>
        let transacoes = [];
        let dataAtual = new Date();
        let anoAtual = dataAtual.getFullYear();
        let mesAtual = dataAtual.getMonth(); // 0 a 11

        const nomesMeses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        let meuGrafico = null;

        function mudarMes(direcao) {
            mesAtual += direcao;
            if (mesAtual > 11) {
                mesAtual = 0;
                anoAtual++;
            } else if (mesAtual < 0) {
                mesAtual = 11;
                anoAtual--;
            }
            atualizarInterface();
        }

        function toggleStatus() {
            const tipo = document.getElementById('tipo').value;
            const checkbox = document.getElementById('status-checkbox');
            const label = document.getElementById('label-status-checkbox');
            const boxRecorrente = document.getElementById('box-recorrente');

            if (tipo === 'receita') {
                label.innerText = "Recebido?";
                checkbox.checked = true;
                boxRecorrente.style.display = 'none';
            } else {
                label.innerText = "Pago?";
                checkbox.checked = false;
                boxRecorrente.style.display = 'block';
            }
        }

        function formatarMesAno(ano, mes) {
            return `${nomesMeses[mes]} de ${ano}`;
        }

        function obterChaveMes(ano, mes) {
            return `${ano}-${String(mes + 1).padStart(2, '0')}`;
        }

        document.getElementById('form-transacao').addEventListener('submit', function(e) {
            e.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const statusCheckbox = document.getElementById('status-checkbox').checked;
            const recorrente = tipo === 'despesa' ? document.getElementById('recorrente').checked : false;

            const mesAnoChave = obterChaveMes(anoAtual, mesAtual);

            // 1. Cadastra no mês atual
            const transacao = {
                id: Date.now(),
                mesAno: mesAnoChave,
                tipo,
                descricao,
                valor,
                efetivado: statusCheckbox
            };
            transacoes.push(transacao);

            // 2. Se recorrente, duplica pendente para o próximo mês
            if (recorrente) {
                let proximoMes = mesAtual + 1;
                let proximoAno = anoAtual;
                if (proximoMes > 11) {
                    proximoMes = 0;
                    proximoAno++;
                }
                const proximoMesAnoChave = obterChaveMes(proximoAno, proximoMes);

                const transacaoProximoMes = {
                    id: Date.now() + 1,
                    mesAno: proximoMesAnoChave,
                    tipo,
                    descricao,
                    valor,
                    efetivado: false
                };
                transacoes.push(transacaoProximoMes);
            }

            atualizarInterface();
            this.reset();
            toggleStatus();
        });

        function deletar(id) {
            transacoes = transacoes.filter(t => t.id !== id);
            atualizarInterface();
        }

        function atualizarInterface() {
            document.getElementById('label-mes-ano').innerText = formatarMesAno(anoAtual, mesAtual);
            const mesAnoChaveAtual = obterChaveMes(anoAtual, mesAtual);

            let totalReceitas = 0;
            let totalDespesasPagas = 0;
            let totalDespesasPendentes = 0;

            const tbody = document.getElementById('tabela-transacoes');
            tbody.innerHTML = '';

            const transacoesDoMes = transacoes.filter(t => t.mesAno === mesAnoChaveAtual);

            transacoesDoMes.forEach(t => {
                if (t.tipo === 'receita') {
                    if (t.efetivado) {
                        totalReceitas += t.valor;
                    }
                } else {
                    if (t.efetivado) {
                        totalDespesasPagas += t.valor;
                    } else {
                        totalDespesasPendentes += t.valor;
                    }
                }

                let badgeStatus = '';
                if (t.tipo === 'receita') {
                    badgeStatus = t.efetivado 
                        ? '<span class="badge bg-success" style="font-size: 0.7rem;">Recebido</span>' 
                        : '<span class="badge bg-warning text-dark" style="font-size: 0.7rem;">A Receber</span>';
                } else {
                    badgeStatus = t.efetivado 
                        ? '<span class="badge bg-danger" style="font-size: 0.7rem;">Pago</span>' 
                        : '<span class="badge bg-warning text-dark" style="font-size: 0.7rem;">Pendente</span>';
                }

                tbody.innerHTML += `
                    <tr>
                        <td>${t.tipo === 'receita' ? 'Rec' : 'Desp'}</td>
                        <td>${t.descricao}</td>
                        <td>R$ ${t.valor.toFixed(2)}</td>
                        <td>${badgeStatus}</td>
                        <td><button class="btn btn-sm btn-outline-danger p-0 px-1" onclick="deletar(${t.id})" style="font-size:0.75rem;"><i class="bi bi-trash"></i></button></td>
                    </tr>
                `;
            });

            if (transacoesDoMes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-2 small">Nenhum lançamento.</td></tr>`;
            }

            const saldo = totalReceitas - totalDespesasPagas;
            const liquido = totalReceitas - (totalDespesasPagas + totalDespesasPendentes);

            document.getElementById('card-receitas').innerText = `R$ ${totalReceitas.toFixed(2)}`;
            document.getElementById('card-despesas-pagas').innerText = `R$ ${totalDespesasPagas.toFixed(2)}`;
            document.getElementById('card-despesas-pendentes').innerText = `R$ ${totalDespesasPendentes.toFixed(2)}`;
            document.getElementById('card-saldo').innerText = `R$ ${saldo.toFixed(2)}`;
            document.getElementById('card-liquido').innerText = `R$ ${liquido.toFixed(2)}`;

            atualizarGrafico(totalReceitas, totalDespesasPagas, totalDespesasPendentes);
        }

        function atualizarGrafico(receitas, despesasPagas, despesasPendentes) {
            const ctx = document.getElementById('graficoFinanceiro').getContext('2d');
            
            if (meuGrafico) {
                meuGrafico.destroy();
            }

            meuGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Receitas', 'Despesas Pagas', 'Pendentes'],
                    datasets: [{
                        label: 'Valor (R$)',
                        data: [receitas, despesasPagas, despesasPendentes],
                        backgroundColor: ['#198754', '#dc3545', '#ffc107'],
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        atualizarInterface();
    </script>
</body>
</html>
