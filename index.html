<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 pb-24">

    <div class="max-w-md mx-auto">
        <!-- Cabeçalho / Resumo -->
        <header class="flex justify-between mb-6">
            <div class="bg-red-500 text-white p-4 rounded-xl flex-1 mr-2 shadow">
                <p class="text-xs">Despesas</p>
                <p class="text-lg font-bold">R$ 290,00</p>
            </div>
            <div class="bg-amber-500 text-white p-4 rounded-xl flex-1 ml-2 shadow">
                <p class="text-xs">Receitas</p>
                <p class="text-lg font-bold">R$ 150,00</p>
            </div>
        </header>

        <!-- Lista de Movimentos (Com limpeza correta ao carregar/atualizar) -->
        <div class="bg-white rounded-2xl p-4 shadow mb-4">
            <h2 class="text-gray-700 font-bold mb-3">Movimentações Recentes</h2>
            <div id="listaMovimentos" class="space-y-2">
                <!-- Os itens serão inseridos aqui de forma limpa, sem duplicar dados antigos -->
            </div>
        </div>
    </div>

    <!-- Modal / Card "Novo Lançamento" Recolhível -->
    <div id="modalLancamento" class="fixed inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl p-6 transform translate-y-full transition-transform duration-300 max-w-md mx-auto z-50">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-blue-600 flex items-center gap-2">
                <span>➕</span> Novo Lançamento
            </h3>
            <button onclick="toggleModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form id="formLancamento" onsubmit="salvarLancamento(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo</label>
                <select id="tipo" class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Despesa">Despesa</option>
                    <option value="Receita">Receita</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Aluguel, Salário, Supermercado..." required class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="valor" placeholder="0,00" required class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Forma de Pagamento / Recebimento</label>
                <select id="forma" class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Pix">Pix</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="pago" class="w-4 h-4 text-blue-600 rounded">
                <label for="pago" class="text-sm text-gray-700">Pago?</label>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
                Cadastrar Lançamento
            </button>
        </form>
    </div>

    <!-- Botão Flutuante (Abre/Fecha o Modal) -->
    <button onclick="toggleModal()" class="fixed right-6 bottom-6 bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl transition transform hover:scale-105 z-40">
        +
    </button>

    <script>
        let isOpen = false;

        function toggleModal() {
            isOpen = !isOpen;
            const modal = document.getElementById('modalLancamento');
            if (isOpen) {
                modal.classList.remove('translate-y-full');
            } else {
                modal.classList.add('translate-y-full');
            }
        }

        // Simulação de carregamento limpo (Evita duplicar movimentos anteriores ao atualizar)
        let movimentos = [
            { id: 1, descricao: 'Supermercado', valor: 150.00, tipo: 'Despesa' },
            { id: 2, descricao: 'Freelance', valor: 150.00, tipo: 'Receita' }
        ];

        function carregarMovimentos() {
            const lista = document.getElementById('listaMovimentos');
            lista.innerHTML = ''; // Limpa o container antes de renderizar para evitar duplicações ao atualizar

            if (movimentos.length === 0) {
                lista.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Nenhum movimento registrado.</p>';
                return;
            }

            movimentos.forEach(m => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100';
                item.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-800">${m.descricao}</p>
                        <p class="text-xs text-gray-400">${m.tipo}</p>
                    </div>
                    <span class="font-bold ${m.tipo === 'Despesa' ? 'text-red-500' : 'text-emerald-600'}">
                        ${m.tipo === 'Despesa' ? '-' : '+'} R$ ${m.valor.toFixed(2)}
                    </span>
                `;
                lista.appendChild(item);
            });
        }

        function salvarLancamento(event) {
            event.preventDefault();
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const tipo = document.getElementById('tipo').value;

            // Adiciona novo item
            movimentos.unshift({ id: Date.now(), descricao, valor, tipo });
            
            // Recarrega a lista limpa
            carregarMovimentos();

            // Limpa form e fecha modal
            document.getElementById('formLancamento').reset();
            toggleModal();
        }

        // Inicializa a aplicação de forma limpa
        window.onload = function() {
            carregarMovimentos();
        };
    </script>
</body>
</html>
